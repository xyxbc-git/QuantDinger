# QuantDinger 本地定制 Compose（基于 docker-compose.ghcr.yml 改造）
#
# 与官方 ghcr 文件的差异（按你的要求）：
#   1) postgres / redis 的「数据 + 配置」全部 bind mount 到宿主机 /Users/jolly/docker 下：
#        /Users/jolly/docker/postgres/data   -> 数据库数据（postgresql.conf 也在此目录内）
#        /Users/jolly/docker/redis/data       -> Redis AOF 持久化数据
#        /Users/jolly/docker/redis/conf/redis.conf -> Redis 配置文件
#   2) Redis 宿主机端口改为 7379（你本机已有 6379，避免冲突）。
#      注意：容器之间仍走内网 redis:6379，所以 backend 不用改任何配置。
#
# 用法（在 QuantDinger 目录下）：
#   cp backend_api_python/env.example backend.env   # 首次：准备后端配置（见部署文档第 2 节）
#   docker compose -f docker-compose.local.yml up -d
#   # 打开 http://localhost:8888  登录 quantdinger / 123456
#
# backend_logs / backend_data 仍用 Docker 命名卷（你只要求 db 和 redis 落本地）；
# 如也想落到 /Users/jolly/docker/backend 下，告诉我，我顺手改。

services:
  postgres:
    image: ${IMAGE_PREFIX:-}postgres:16-alpine
    container_name: quantdinger-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantdinger}
      POSTGRES_USER: ${POSTGRES_USER:-quantdinger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantdinger123}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - "postgres"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-150}"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-256MB}"
    volumes:
      # 数据 + postgresql.conf 都在这个目录里（PG 把配置文件放在数据目录内）
      - /Users/jolly/docker/postgres/data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-127.0.0.1:5432}:5432"
    networks:
      - quantdinger-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantdinger} -d ${POSTGRES_DB:-quantdinger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${IMAGE_PREFIX:-}redis:7-alpine
    container_name: quantdinger-redis
    restart: unless-stopped
    # 用宿主机的 redis.conf 启动
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - /Users/jolly/docker/redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - /Users/jolly/docker/redis/data:/data
    ports:
      # 宿主机 7379 -> 容器 6379（避开你本机已有的 6379）
      - "127.0.0.1:7379:6379"
    networks:
      - quantdinger-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/brokermr810/quantdinger-backend}:${BACKEND_TAG:-${IMAGE_TAG:-latest}}
    pull_policy: always
    container_name: quantdinger-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-127.0.0.1:5000}:5000"
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - ./backend.env:/app/.env
    environment:
      - PYTHON_API_HOST=0.0.0.0
      - PYTHON_API_PORT=5000
      - GIT_TAG=${GIT_TAG:-${BACKEND_TAG:-${IMAGE_TAG:-}}}
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quantdinger}:${POSTGRES_PASSWORD:-quantdinger123}@postgres:5432/${POSTGRES_DB:-quantdinger}
      - DB_TYPE=postgresql
      # 容器内仍连内网 redis:6379（与宿主机 7379 无关）
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_ENABLED=true
      - DB_POOL_MIN=${DB_POOL_MIN:-5}
      - DB_POOL_MAX=${DB_POOL_MAX:-50}
      - DB_POOL_ACQUIRE_TIMEOUT=${DB_POOL_ACQUIRE_TIMEOUT:-10}
      - DB_POOL_HEALTH_CHECK=${DB_POOL_HEALTH_CHECK:-true}
      - MARKET_EXECUTOR_WORKERS=${MARKET_EXECUTOR_WORKERS:-6}
      - PORTFOLIO_EXECUTOR_WORKERS=${PORTFOLIO_EXECUTOR_WORKERS:-3}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-8}
      - ALLOW_LOCAL_DESKTOP_BROKERS=${ALLOW_LOCAL_DESKTOP_BROKERS:-true}
    networks:
      - quantdinger-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/brokermr810/quantdinger-frontend}:${FRONTEND_TAG:-${IMAGE_TAG:-latest}}
    pull_policy: always
    container_name: quantdinger-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8888}:80"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:5000}
    depends_on:
      - backend
    networks:
      - quantdinger-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_logs:
    driver: local
  backend_data:
    driver: local

networks:
  quantdinger-network:
    driver: bridge
